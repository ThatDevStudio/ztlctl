name: Validate workspace
description: Run the shared validation gates for ztlctl.

inputs:
  commit_lint:
    description: Whether to run commit message linting.
    required: true

runs:
  using: composite
  steps:
    - name: Set up uv
      id: setup_uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Sync dev dependencies
      id: sync_dev
      shell: bash
      run: uv sync --group dev

    - name: Ruff check
      id: ruff_check
      shell: bash
      run: uv run ruff check .

    - name: Ruff format check
      id: ruff_format
      shell: bash
      run: uv run ruff format --check .

    - name: Mypy
      id: mypy
      shell: bash
      run: uv run mypy src/

    - name: Pytest
      id: pytest
      shell: bash
      run: uv run pytest --cov --cov-report=term-missing

    - name: Build package
      id: build
      shell: bash
      run: uv build

    - name: Pip audit
      id: pip_audit
      shell: bash
      run: uvx pip-audit

    - name: Sync MCP extra dependencies
      id: sync_mcp
      shell: bash
      run: uv sync --group test --extra mcp

    - name: MCP extra tests
      id: mcp_tests
      shell: bash
      run: uv run pytest tests/mcp/test_stdio_integration.py tests/commands/test_serve.py -q

    - name: Sync semantic extra dependencies
      id: sync_semantic
      shell: bash
      run: uv sync --group test --extra semantic

    - name: Semantic extra tests
      id: semantic_tests
      shell: bash
      run: uv run pytest tests/integration/test_semantic_extra.py -q

    - name: Commit lint
      id: commit_lint
      if: ${{ inputs.commit_lint == 'true' }}
      shell: bash
      run: uv run cz check --rev-range "origin/${{ github.base_ref }}..HEAD"

    - name: Validation summary
      if: ${{ always() }}
      shell: bash
      run: |
        cat >> "$GITHUB_STEP_SUMMARY" <<EOF
        ### Validation summary

        | Gate | Result |
        | --- | --- |
        | Set up uv | ${{ steps.setup_uv.outcome }} |
        | Sync dev dependencies | ${{ steps.sync_dev.outcome }} |
        | Ruff check | ${{ steps.ruff_check.outcome }} |
        | Ruff format check | ${{ steps.ruff_format.outcome }} |
        | Mypy | ${{ steps.mypy.outcome }} |
        | Pytest | ${{ steps.pytest.outcome }} |
        | Build package | ${{ steps.build.outcome }} |
        | Pip audit | ${{ steps.pip_audit.outcome }} |
        | Sync MCP extra dependencies | ${{ steps.sync_mcp.outcome }} |
        | MCP extra tests | ${{ steps.mcp_tests.outcome }} |
        | Sync semantic extra dependencies | ${{ steps.sync_semantic.outcome }} |
        | Semantic extra tests | ${{ steps.semantic_tests.outcome }} |
        | Commit lint | ${{ steps.commit_lint.outcome || 'skipped' }} |
        EOF
