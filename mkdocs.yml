site_name: ZettelControl
site_description: CLI utility and agentic note-taking ecosystem for knowledge graph management.
site_url: https://thatdevstudio.github.io/ztlctl/
repo_url: https://github.com/ThatDevStudio/ztlctl
repo_name: ThatDevStudio/ztlctl

docs_dir: docs

theme:
  name: shadcn
  show_title: true
  show_stargazers: true
  show_datetime: false
  pygments_style:
    light: shadcn-light
    dark: github-dark

exclude_docs: |
  plans/

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - User Guide:
    - guide/index.md
    - Tutorial: tutorial.md
    - Core Concepts: concepts.md
    - Knowledge Paradigms: paradigms.md
    - Obsidian Starter Kit: obsidian.md
    - Built-in Plugins: plugins.md
    - Agentic Workflows: agentic-workflows.md
    - Command Reference: commands.md
    - Configuration: configuration.md
    - Troubleshooting: troubleshooting.md
  - Developer Guide:
    - dev/index.md
    - Contributing: development.md
    - Plugin Authoring: plugin-guide.md
    - API Reference: api-reference.md
    - MCP Server: mcp.md

plugins:
  - search
  - redirects:
      redirect_maps: {}
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            heading_level: 2
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            filters:
              - "!^_"
            show_signature_annotations: true
            separate_signature: true
            allow_inspection: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - footnotes
  - tables
  - toc:
      permalink: true

copyright: >-
  MIT License. Distributed under the
  <a href="https://github.com/ThatDevStudio/ztlctl/blob/develop/LICENSE">MIT License</a>.
